#Miscellaneous settings
[misc]
	#Does Depth Strider Stack with Swim Speed Attributes?
	depthStriderStacks = false
	#Other swim speed enchantments that do not stack with Swim Speed Attributes (enchantment ids)
	nonStackingSwimEnchantments = []
	#If enabled, the player will be unable to move when transforming from one race to another
	preventMovementWhileTransforming = false
	#Vanilla MC doesn't handle interaction with increased reach properly, this fixes it
	reachInteractionFix = true
	#Hidden feature, add anything into this list to disable it.
	disabledBlessings = []

#Food settings
[food]
	#Register this mod's foods. Requires a game restart to take effect.
	enabled = true
	#Do race foods apply their transformation effect?
	transformationEffects = true
	#Are transformation effects kept on death?
	keepEffectsOnDeath = true

#Per-race settings
[races]
	#Prompts the player to choose a Race when joining a world for the first time.
	selectionMenu = false
	#These are races which are blacklisted from the Race Selection Menu if Enabled
	selectionBlacklist = ["Dragon", "Taurus"]

	#human settings
	[races.human]
		#Can this race ride entities at all?
		canMount = true
		#Can this race steer boats?
		canControlBoats = true
		#Treat the mount list as a whitelist instead of a blacklist
		mountWhitelist = false
		#Entity ids this race may not ride; "modid:*" matches a whole mod
		mountBlacklist = []
		#Effects granted while transformed. Format: [modid:]effect[:duration[:amplifier]]
		effectsToAdd = []
		#Effects this race is immune to. Same format as effectsToAdd
		effectsToRemove = []
		#Damage rules. Format: [onAttacked:|onHurt:|onDamaged:][eleFire:]type[;category][;[isTrue:]entity][;maxDamage[;multiplier]]
		#type: * / legacy id (inFire, mob) / registry id / #tag; category: isFire, isMagic, isIce, isPoison...; multiplier defaults to 0 (immune)
		#Example: onHurt:*;isFire;isTrue:minecraft:blaze;5.0;0.1
		damageTypesToIgnore = []
		#Attribute modifiers applied while transformed. Format: Name:attribute, Amount:value, Operation:0|1|2
		attributes = []
		#Magic affinity; scales this race's mana pool
		#Range: 0 ~ 10000
		magicAffinity = 100

		[races.human.size]
			#Height as a percentage of the default player height
			#Range: 1 ~ 1000
			height = 100
			#Width as a percentage of the default player width
			#Range: 1 ~ 1000
			width = 100

		#Survival mod compatibility (Cold Sweat / Simple Difficulty)
		[races.human.survival]
			#Immune to overheating (Cold Sweat)
			immuneToHeat = false
			#Immune to freezing (Cold Sweat)
			immuneToCold = false
			#Immune to the Thirsty effect from dirty water (Simple Difficulty)
			immuneToThirst = false
			#Immune to the Parasites effect from dirty water (Simple Difficulty)
			immuneToParasites = false

