#杂项设置
[misc]
	#深海漫步(Depth Strider)是否与游泳速度属性叠加？
	depthStriderStacks = false
	#不与游泳速度属性叠加的其他游泳速度附魔(附魔 ID)
	nonStackingSwimEnchantments = []
	#若启用，玩家在种族变身时将无法移动
	preventMovementWhileTransforming = true
	#原版 MC 无法正确处理增加触及距离后的交互，此项可修复该问题
	reachInteractionFix = true
	#隐藏功能，向此列表添加任意内容即可禁用它。
	disabledBlessings = []

#食物设置
[food]
	#注册本模组的食物。需要重启游戏才能生效。
	enabled = true
	#种族食物是否施加其变身效果？
	transformationEffects = true
	#变身效果在死亡后是否保留？
	keepEffectsOnDeath = true

#各物种设置
[races]
	#玩家首次进入世界时提示选择种族。
	selectionMenu = false
	#启用后，这些种族将被排除在种族选择菜单之外
	selectionBlacklist = ["Dragon", "Taurus"]

	#人类设置
	[races.human]
		#该种族能否骑乘实体？
		canMount = true
		#该种族能否操控船只？
		canControlBoats = true
		#将骑乘列表视为白名单而非黑名单
		mountWhitelist = false
		#该种族不可骑乘的实体 ID；"modid:*" 可匹配整个模组
		mountBlacklist = []
		#变身时获得的效果。格式：[modid:]effect[:duration[:amplifier]]
		effectsToAdd = []
		#该种族免疫的效果。格式同 effectsToAdd
		effectsToRemove = []
		#伤害规则。格式：[onAttacked:|onHurt:|onDamaged:][eleFire:]type[;category][;[isTrue:]entity][;maxDamage[;multiplier]]
		#类型：* / 旧版 ID(inFire, mob) / 注册表 ID / #标签；类别：isFire, isMagic, isIce, isPoison……；倍率默认为 0(免疫)
		#示例：onHurt:*;isFire;isTrue:minecraft:blaze;5.0;0.1
		damageTypesToIgnore = []
		#变身时应用的属性修正。格式：Name:attribute, Amount:value, Operation:0|1|2
		attributes = []
		#魔法亲和度；影响该种族的法力池大小
		#范围：0 ~ 10000
		magicAffinity = 100

		[races.human.size]
			#高度(占默认玩家身高的百分比)
			#范围：1 ~ 1000
			height = 100
			#宽度(占默认玩家宽度的百分比)
			#范围：1 ~ 1000
			width = 100

		#生存模组兼容性(Cold Sweat / Simple Difficulty)
		[races.human.survival]
			#免疫过热(Cold Sweat)
			immuneToHeat = false
			#免疫冰冻(Cold Sweat)
			immuneToCold = false
			#免疫脏水引起的口渴效果(Simple Difficulty)
			immuneToThirst = false
			#免疫脏水引起的寄生虫效果(Simple Difficulty)
			immuneToParasites = false

