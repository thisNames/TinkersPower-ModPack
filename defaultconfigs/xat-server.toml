	#Enhanced Visuals: clear vision abilities
	enhancedVisuals = true
	#Lycanites Mobs: Weightless blocks the Weight effect
	lycanitesMobs = false
	#Defiled Lands: Vicious Strike can use its Bleeding effect
	defiledLands = false

