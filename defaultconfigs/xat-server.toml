	#龙设置
	[races.dragon]
		#该种族能否骑乘实体？
		canMount = true
		#该种族能否操控船只？
		canControlBoats = true
		#将骑乘列表视为白名单而非黑名单
		mountWhitelist = false
		#该种族不可骑乘的实体 ID；"modid:*" 可匹配整个模组
		mountBlacklist = []
		#变身时获得的效果。格式：[modid:]effect[:duration[:amplifier]]
		effectsToAdd = []
		#该种族免疫的效果。格式同 effectsToAdd
		effectsToRemove = []
		#伤害规则。格式：[onAttacked:|onHurt:|onDamaged:][eleFire:]type[;category][;[isTrue:]entity][;maxDamage[;multiplier]]
		#类型：* / 旧版 ID(inFire, mob) / 注册表 ID / #标签；类别：isFire, isMagic, isIce, isPoison……；倍率默认为 0(免疫)
		#示例：onHurt:*;isFire;isTrue:minecraft:blaze;5.0;0.1
		damageTypesToIgnore = []
		#变身时应用的属性修正。格式：Name:attribute, Amount:value, Operation:0|1|2
		attributes = [
			"Name:minecraft:generic.max_health, Amount:0.4, Operation:1",
			"Name:minecraft:generic.attack_damage, Amount:0.4, Operation:1",
			"Name:minecraft:generic.armor, Amount:0.4, Operation:1",
			"Name:minecraft:generic.armor_toughness, Amount:0.35, Operation:1",
			"Name:minecraft:generic.movement_speed, Amount:0.2, Operation:1",
			"Name:forge:swim_speed, Amount:-0.4, Operation:1",
			"Name:xat:fly_speed, Amount:0.6, Operation:2",
			"Name:generic.reachDistance, Amount:0.1, Operation:1"
		]
		#魔法亲和度；影响该种族的法力池大小
		#范围：0 ~ 10000
		magicAffinity = 400

		[races.dragon.size]
			#高度(占默认玩家身高的百分比)
			#范围：1 ~ 1000
			height = 120
			#宽度(占默认玩家宽度的百分比)
			#范围：1 ~ 1000
			width = 120

		#生存模组兼容性(Cold Sweat / Simple Difficulty)
		[races.dragon.survival]
			#免疫过热(Cold Sweat)
			immuneToHeat = false
			#免疫冰冻(Cold Sweat)
			immuneToCold = false
			#免疫脏水引起的口渴效果(Simple Difficulty)
			immuneToThirst = false
			#免疫脏水引起的寄生虫效果(Simple Difficulty)
			immuneToParasites = false

		[races.dragon.abilities]

			[races.dragon.abilities.flight]
				#启用此能力
				enabled = true
				#飞行时每秒消耗的法力；0 表示飞行免费
				#范围：0.0 ~ 10000.0
				cost = 5.0

			[races.dragon.abilities.elytra_flight]
				#启用此能力
				enabled = true
				#滑翔时按跳跃键可获得向上推力
				liftEnabled = true
				#滑翔时撞墙会像原版鞘翅一样造成伤害
				collisionDamage = true
				#滑翔时每秒消耗的法力；0 表示滑翔免费
				#范围：0.0 ~ 10000.0
				cost = 0.0
				#每次上推消耗的法力
				#范围：0.0 ~ 10000.0
				liftCost = 10.0
				#每次上推增加的向上速度
				#范围：0.0 ~ 10.0
				liftStrength = 0.42

			[races.dragon.abilities.night_vision]
				#启用此能力
				enabled = true
				#激活时每秒消耗的法力；0 表示免费
				#范围：0.0 ~ 10000.0
				cost = 0.0

