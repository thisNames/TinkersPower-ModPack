
#服务器到客户端同步的配置设置
["Damage System"]
	#头部的最大生命值
	#范围：2 ~ 12
	maxHealthHead = 12
	#左臂的最大生命值
	#范围：2 ~ 12
	maxHealthLeft_Arm = 12
	#左腿的最大生命值
	#范围：2 ~ 12
	maxHealthLeft_Leg = 12
	#左脚的最大生命值
	#范围：2 ~ 12
	maxHealthLeft_Foot = 12
	#身体的最大生命值
	#范围：2 ~ 12
	maxHealthBody = 12
	#右臂的最大生命值
	#范围：2 ~ 12
	maxHealthRight_Arm = 12
	#右腿的最大生命值
	#范围：2 ~ 12
	maxHealthRight_Leg = 12
	#右脚的最大生命值
	#范围：2 ~ 12
	maxHealthRight_Foot = 12
	#若头部生命值降至 0 时是否会导致死亡
	causeDeathHead = true
	#若身体生命值降至 0 时是否会导致死亡
	causeDeathBody = true

