["Internal Healing"]

	["Internal Healing".bandage]
		#此物品使用时提供的总治疗次数。1 次治疗 = 半颗心
		#范围：1 ~ 127
		totalsHeals = 4
		#单次治疗触发所需的时间。此物品的总生效时间 = 该值 × 总治疗次数
		#范围：1 ~ 32767
		secondsPerHeal = 10
		#在 GUI 中应用此物品所需的时间（毫秒）
		#范围：0 ~ 16000
		applyTime = 2500

	["Internal Healing".plaster]
		#此物品使用时提供的总治疗次数。1 次治疗 = 半颗心
		#范围：1 ~ 127
		totalsHeals = 2
		#单次治疗触发所需的时间。此物品的总生效时间 = 该值 × 总治疗次数
		#范围：1 ~ 32767
		secondsPerHeal = 10
		#在 GUI 中应用此物品所需的时间（毫秒）
		#范围：0 ~ 16000
		applyTime = 3000

["External Healing"]
	#允许原版的自然生命恢复。需要 "allowOtherHealingItems" 为 true
	#**警告** 这会在内部为你的所有世界设置游戏规则 "naturalRegeneration"，因此即使移除模组也会持续生效
	allowNaturalRegeneration = false
	#若为 false，治疗药水和其他治疗物品将无效
	allowOtherHealingItems = true
	#指定睡觉时应恢复最大生命值的百分比
	#范围：0.0 ~ 1.0
	sleepHealPercentage = 0.88
	#外部回复将被乘以此值。若 "allowOtherHealingItems" 被禁用则无效
	#范围：0.0 ~ 20.0
	otherRegenMultiplier = 1.25
	#原版自然生命恢复将被乘以此值。若 "allowNaturalRegeneration" 被禁用则无效
	#范围：0.0 ~ 20.0
	naturalRegenMultiplier = 0.5
	#指定原版抗性药水效果应如何减少伤害。
	#默认情况下，一级抗性减少 20% 伤害。将此值改为例如 10，则每级减少 10% 伤害
	#范围：1 ~ 40
	resistanceReductionPercentPerLevel = 20

[misc]
	#若为 true，最大生命值会按你的心数缩放，配置项会乘以系数以匹配最大生命值
	scaleMaxHealth = true
	#若为 true，最大生命值上限为 6 颗心，每个肢体伤害吸收上限为 2 颗心。若为 false，生命值上限会高得多（普通 64 颗心，伤害吸收 16 颗心）
	capMaxHealth = false
	#指定原版生命值如何计算。影响原版可视生命条，以及其他模组查询玩家生命值时看到的值。
	#AVERAGE_ALL：取所有肢体并计算其平均值。
	#AVERAGE_CRITICAL：取所有关键肢体并计算其平均值。
	#MIN_CRITICAL：取所有关键肢体中最小的生命值。
	#若所有关键肢体都已被禁用，则不起作用。
	#允许的值：AVERAGE_ALL、AVERAGE_CRITICAL、MIN_CRITICAL、CRITICAL_50_PERCENT_OTHER_50_PERCENT
	vanillaHealthCalculation = "AVERAGE_ALL"
	#若启用，默认的随机伤害分配将被改为尽可能让关键肢体保留 1 点生命值。
	#当伤害过大时，伤害仍会杀死玩家。其他已定义的分配方式不受此影响。
	useFriendlyRandomDistribution = false
	#若设为 LOCAL_ENCHANTMENTS，只考虑当前受伤身体部位所穿护甲的附魔。护甲强度会乘以 4（默认值，可通过 enchantmentMultiplier 更改），以匹配原版默认值
	#若设为 GLOBAL_ENCHANTMENTS，对所有穿戴了任何护甲的身体部位，都考虑所有护甲部件的附魔。
	#允许的值：GLOBAL_ENCHANTMENTS、LOCAL_ENCHANTMENTS
	armorEnchantmentMode = "LOCAL_ENCHANTMENTS"

["Enchantment Handling"]
	#指定默认修正系数。仅在 armorEnchantmentMode 为 LOCAL_ENCHANTMENTS 时使用，用于放大数值以大致匹配原版的平衡（因为原版围绕全局附魔平衡）
	#范围：1 ~ 4
	enchantmentMultiplier = 4
	#指定修正系数的覆盖值。仅在 armorEnchantmentMode 为 LOCAL_ENCHANTMENTS 时使用。可用于为特殊附魔设置其他倍率
	#此列表指定附魔的资源位置。必须完整指定，不能使用通配符。示例：minecraft:feather_falling。此处第一项对应第一个倍率，第二项对应第二个倍率，依此类推
	resourceLocations = ["minecraft:feather_falling"]
	#指定修正系数的覆盖值。仅在 armorEnchantmentMode 为 LOCAL_ENCHANTMENTS 时使用。可用于为特殊附魔设置其他倍率
	#此列表指定对应资源位置的倍率。参见 resourceLocations 注释。必须介于 1 和 4 之间
	overrideMultiplier = [2]
