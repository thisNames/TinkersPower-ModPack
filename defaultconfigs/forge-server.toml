# Forge（Minecraft）
#服务器配置设置
[server]
	#设为 true 时，移除任何在 update 方法中抛出错误的方块实体，而不是关闭服务器并报告崩溃日志。警告：这可能会搞乱一切，请谨慎使用，后果自负。
	removeErroringBlockEntities = false
	#设为 true 时，移除任何在 tick 方法中抛出错误的实体（注意：不包括方块实体），而不是关闭服务器并报告崩溃日志。警告：这可能会搞乱一切，请谨慎使用，后果自负。
	removeErroringEntities = false
	#设为 true 时，会检查实体整个碰撞包围盒以判断梯子，而非仅检查其所在方块。这会导致机制上的明显差异，因此默认采用原版行为。默认：false。
	fullBoundingBoxLadders = false
	#僵尸召唤的基础生成概率。可调整额外的僵尸召唤机制。
	#范围：0.0 ~ 1.0
	zombieBaseSummonChance = 0.1
	#僵尸（或其子类）为幼儿的概率。可调整僵尸生成机制。
	#范围：0.0 ~ 1.0
	zombieBabyChance = 0.05
	#服务器使用的权限处理器。若未注册同名处理器，则默认使用 forge:default_handler。
	permissionHandler = "forge:default_handler"
	#设为 true 时，向本地局域网客户端广播专用服务器，使其自动出现在多人游戏列表中。
	advertiseDedicatedServerToLan = true
	#设为 true 时，允许生物使用持续时间为 0 的物品。修复了按住使用键可重复使用的末影之眼问题。默认关闭，因为这可能改变与现有模组物品的交互。
	useItemWithDurationZero = false

