# 机械动力
#基础
[infrastructure]
	#.
	#[单位：Tick]
	#服务器在发送 tick 速率同步数据包前等待的时间。
	#当 TPS 低于 20 时，这些数据包有助于让动画更准确。
	#范围：> 5
	tickrateSyncTimer = 20

#.
#整合包作者的内部配方兼容控制面板
[recipes]
	#.
	#.
	#允许机械压力机一次性处理整组堆叠。
	bulkPressing = false
	#.
	#允许机械锯一次性处理整组堆叠。
	bulkCutting = false
	#.
	#允许由机械搅拌机 + 盆来酿造受支持的药水。
	allowBrewingInMixer = true
	#.
	#允许任何无序合成配方由机械搅拌机 + 盆处理。
	allowShapelessInMixer = true
	#.
	#允许任何单材料 2x2 或 3x3 合成配方由机械压力机 + 盆处理。
	allowShapedSquareInPress = true
	#.
	#允许任何标准合成配方由机械合成器处理。
	allowRegularCraftingInCrafter = true
	#.
	#使用机械合成器制作烟花火箭时可使用的最大材料数量。
	#范围：> 1
	maxFireworkIngredientsInCrafter = 9
	#.
	#允许任何切石配方由机械锯处理。
	allowStonecuttingOnSaw = true
	#.
	#允许注液器与匠魂的铸造台和铸造盆交互。
	allowCastingBySpout = true
	#.
	#在 JEI 中显示原版原木剥皮交互。
	displayLogStrippingRecipes = true
	#.
	#在彩色化合物转化为精炼光辉前需要摧毁的光源数量。
	#范围：> 1
	lightSourceCountForRefinedRadiance = 10
	#.
	#允许标准的世界内精炼光辉配方。
	enableRefinedRadianceRecipe = true
	#.
	#允许标准的世界内暗影钢配方。
	enableShadowSteelRecipe = true

#.
#Create 动力机械的参数与能力
[kinetics]
	#.
	#.
	#完全禁用应力机制。
	disableStress = false
	#.
	#机械传送带的方块最大长度。
	#范围：> 5
	maxBeltLength = 20
	#.
	#链式传送连接的方块最大长度。
	#范围：> 5
	maxChainConveyorLength = 32
	#.
	#每个链式传送机可拥有的最大连接数。
	#范围：> 1
	maxChainConveyorConnections = 4
	#.
	#运转中的破碎轮造成的伤害。
	#范围：> 0
	crushingDamage = 4
	#.
	#[单位：每分钟转数]
	#任何动力方块允许的最大转速。
	#范围：> 64
	maxRotationSpeed = 256
	#.
	#选择哪些生物在被部署器攻击时应忽略部署器。
	#可选值：ALL, CREEPERS, NONE
	ignoreDeployerAttacks = "CREEPERS"
	#.
	#动力方块检查其动力源是否仍然有效之间的游戏刻间隔。
	#范围：> 5
	kineticValidationFrequency = 60
	#.
	#转动手摇曲柄时，用于计算速度带来饥饿消耗的倍数。
	#范围：0.0 ~ 1.0
	crankHungerMultiplier = 0.009999999776482582
	#.
	#风车成功组装所需的帆型方块数量。
	#范围：> 0
	minimumWindmillSails = 8
	#.
	#使风车转速提升 1RPM 所需的帆型方块数量。
	#范围：> 1
	windmillSailsPerRPM = 8
	#.
	#配重喷射器可投掷方块的最大距离
	#范围：> 0
	maxEjectorDistance = 32
	#.
	#喷射器发射的物品下一次扫描方块以检测潜在碰撞前的游戏刻时间
	#范围：> 10
	ejectorScanInterval = 120

	#.
	#封装风扇
	[kinetics.encasedFan]
		#.
		#风扇可推动实体的方块最大距离。
		#范围：> 5
		fanPushDistance = 20
		#.
		#风扇可拉取实体的方块最大距离。
		#范围：> 5
		fanPullDistance = 20
		#.
		#风扇检查是否有物体阻挡其气流之间的游戏刻间隔。
		#范围：> 10
		fanBlockCheckRate = 30
		#.
		#[单位：每分钟转数]
		#风扇达到最高性能时的转速。
		#范围：> 64
		fanRotationArgmax = 256
		#.
		#基于风扇的处理配方生效所需的游戏刻数。
		#范围：> 0
		fanProcessingTime = 150

	#.
	#移动结构体
	[kinetics.contraptions]
		#.
		#可由活塞、轴承或其他方式移动的结构最大方块数量。
		#范围：> 1
		maxBlocksMoved = 2048
		#.
		#底盘附件范围的最大值。
		#范围：> 1
		maxChassisRange = 16
		#.
		#机械活塞后方可拥有的最大延伸杆数量。
		#范围：> 1
		maxPistonPoles = 64
		#.
		#绳索滑轮可放出的最大绳索长度。
		#范围：> 1
		maxRopeLength = 384
		#.
		#两节相连矿车之间允许的最大距离。
		#范围：> 1
		maxCartCouplingLength = 32
		#.
		#使用机械压路机填充方块的最大深度。
		#范围：> 1
		rollerFillDepth = 12
		#.
		#矿车结构体是否可在生存模式中拾取。
		survivalContraptionPickup = true
		#.
		#配置刷怪笼方块如何被结构体移动。
		#可选值：MOVABLE, NO_PICKUP, UNMOVABLE
		movableSpawners = "NO_PICKUP"
		#.
		#配置萌芽紫晶如何被结构体移动。
		#可选值：MOVABLE, NO_PICKUP, UNMOVABLE
		amethystMovement = "NO_PICKUP"
		#.
		#配置黑曜石方块如何被结构体移动。
		#可选值：MOVABLE, NO_PICKUP, UNMOVABLE
		movableObsidian = "UNMOVABLE"
		#.
		#配置深板岩 Reinforced Deepslate 如何被结构体移动。
		#可选值：MOVABLE, NO_PICKUP, UNMOVABLE
		movableReinforcedDeepslate = "UNMOVABLE"
		#.
		#结构体采集或收获的物品是否放入其挂载的存储中。
		moveItemsToStorage = true
		#.
		#收割机是否应破坏未完全成熟的作物。
		harvestPartiallyGrown = false
		#.
		#收割机是否在收获后重新种植作物。
		harvesterReplants = true
		#.
		#矿车结构体是否可放入容器物品中。
		minecartContraptionInContainers = false
		#.
		#稳定的轴承是否即使在不旋转的结构体上也会创建独立实体。
		#[技术性]
		stabiliseStableContraptions = false
		#.
		#玩家的碰撞箱是否应扩展到结构体碰撞箱的大小。
		#[技术性]
		syncPlayerPickupHitboxWithContraptionHitbox = false
		#.
		#当结构体放置在世界方块内部时，是否阻止方块掉落。
		noDropWhenContraptionReplaceBlocks = false

	#.
	#为需求与指示器配置速度/容量等级。
	[kinetics.stats]
		#.
		#[单位：每分钟转数]
		#被视为“中等”的最小转速
		#范围：0.0 ~ 4096.0
		mediumSpeed = 30.0
		#.
		#[单位：每分钟转数]
		#被视为“快速”的最小转速
		#范围：0.0 ~ 65535.0
		fastSpeed = 100.0
		#.
		#[单位：应力单位]
		#被视为“中等”的最小应力影响
		#范围：0.0 ~ 4096.0
		mediumStressImpact = 4.0
		#.
		#[单位：应力单位]
		#被视为“高”的最小应力影响
		#范围：0.0 ~ 65535.0
		highStressImpact = 8.0
		#.
		#[单位：应力单位]
		#被视为“中等”的源提供的最小附加容量
		#范围：0.0 ~ 4096.0
		mediumCapacity = 256.0
		#.
		#[单位：应力单位]
		#被视为“高”的源提供的最小附加容量
		#范围：0.0 ~ 65535.0
		highCapacity = 1024.0

[kinetics.stressValues]

		#.
		#微调各组件的动力学数值
		[kinetics.stressValues.v2]

			#.
			#.
			#[单位：应力单位]
			#配置机械方块的各自应力影响。注意：每提升一级速度，该消耗会翻倍。
			[kinetics.stressValues.v2.impact]
				brass_encased_shaft = 0.0
				turntable = 4.0
				clutch = 0.0
				mechanical_mixer = 4.0
				gearbox = 0.0
				mechanical_bearing = 4.0
				copper_backtank = 4.0
				hose_pulley = 4.0
				display_board = 0.0
				crushing_wheel = 8.0
				adjustable_chain_gearshift = 0.0
				millstone = 4.0
				rotation_speed_controller = 0.0
				sticky_mechanical_piston = 4.0
				mechanical_crafter = 2.0
				deployer = 4.0
				elevator_pulley = 4.0
				stressometer = 0.0
				cogwheel = 0.0
				encased_chain_drive = 0.0
				belt = 0.0
				brass_encased_large_cogwheel = 0.0
				weighted_ejector = 2.0
				chain_conveyor = 1.0
				mechanical_saw = 4.0
				flywheel = 0.0
				mechanical_piston = 4.0
				speedometer = 0.0
				brass_encased_cogwheel = 0.0
				clockwork_bearing = 4.0
				mechanical_press = 8.0
				mechanical_drill = 4.0
				andesite_encased_shaft = 0.0
				netherite_backtank = 4.0
				mechanical_arm = 2.0
				sequenced_gearshift = 0.0
				andesite_encased_large_cogwheel = 0.0
				shaft = 0.0
				cuckoo_clock = 1.0
				gearshift = 0.0
				rope_pulley = 4.0
				andesite_encased_cogwheel = 0.0
				large_cogwheel = 0.0
				encased_fan = 2.0
				mysterious_cuckoo_clock = 1.0
				gantry_shaft = 0.0
				mechanical_pump = 4.0

			#.
			#[单位：应力单位]
			#配置一个动力源可承载的应力量。
			[kinetics.stressValues.v2.capacity]
				steam_engine = 1024.0
				water_wheel = 32.0
				copper_valve_handle = 8.0
				hand_crank = 8.0
				creative_motor = 16384.0
				large_water_wheel = 128.0
				windmill_bearing = 512.0

#.
#Create 的液体操作工具
[fluids]
	#.
	#.
	#[单位：桶]
	#每个方块容量的储罐可盛装的液体量。
	#范围：> 1
	fluidTankCapacity = 8
	#.
	#[单位：方块]
	#流体储罐可达到的最大高度。
	#范围：> 1
	fluidTankMaxHeight = 32
	#.
	#[单位：方块]
	#机械泵可在任一侧推送或抽取液体方块的最大距离。
	#范围：> 1
	mechanicalPumpRange = 16
	#.
	#[单位：方块]
	#软管滑轮可抽取流体方块的最大距离。
	#范围：> 1
	hosePulleyRange = 128
	#.
	#[单位：方块]
	#[-1 表示禁用此行为]
	#软管滑轮在判定为无限水源前需要找到的最小流体方块数量。
	#范围：> -1
	hosePulleyBlockThreshold = 10000
	#.
	#软管滑轮是否应继续填充超过阈值的源。
	fillInfinite = false
	#.
	#配置哪些流体可被无限抽取。
	#可选值：ALLOW_ALL, DENY_ALL, ALLOW_BY_TAG, DENY_BY_TAG
	bottomlessFluidMode = "ALLOW_BY_TAG"
	#.
	#软管滑轮是否被允许放置流体源。
	fluidFillPlaceFluidSourceBlocks = true
	#.
	#开口管道是否被允许放置流体源。
	pipesPlaceFluidSourceBlocks = true

#.
#物流组件的微调
[logistics]
	#.
	#.
	#漏斗在未由红石重新激活时，两次物品传输之间等待的游戏刻数。
	#范围：> 1
	defaultExtractionTimer = 8
	#.
	#便携式存储接口等待传输、之后才让结构体继续移动的游刻数。
	#范围：> 1
	psiTimeout = 60
	#.
	#机械臂可横跨的方块最大距离。
	#范围：> 1
	mechanicalArmRange = 5
	#.
	#包裹端口可放置于其目标处的最大方块距离。
	#范围：> 1
	packagePortRange = 5
	#.
	#红石连接可能的最大方块范围。
	#范围：> 1
	linkRange = 256
	#.
	#显示连接与其目标之间可能的方块最大距离。
	#范围：> 1
	displayLinkRange = 64
	#.
	#金库每个方块体积可容纳的总堆叠数。
	#范围：1 ~ 2048
	vaultCapacity = 20
	#.
	#链式传送机一次可承载的包裹数量。
	#范围：> 1
	chainConveyorCapacity = 20
	#.
	#黄铜分流器两次分配之间等待的游戏刻数。
	#范围：1 ~ 10
	brassTunnelTimer = 10
	#.
	#工厂计量器两次请求之间等待的游戏刻数。
	#范围：> 5
	factoryGaugeTimer = 100
	#.
	#敌对生物走到座位附近时是否会开始骑乘。
	seatHostileMobs = true

#.
#与 schematic 蓝图工具相关的一切
[schematics]
	#.
	#.
	#在创造模式下直接放置蓝图时，是否应用空气替换世界方块
	creativePrintIncludesAir = false
	#.
	#玩家可上传的蓝图数量，超过后较早的会被覆盖。
	#范围：> 1
	maxSchematics = 10
	#.
	#[单位：KB]
	#上传蓝图允许的最大文件大小。
	#范围：> 16
	maxTotalSchematicSize = 256
	#.
	#[单位：字节]
	#上传蓝图被拆分的最大数据包大小。
	#范围：256 ~ 32767
	maxSchematicPacketSize = 1024
	#.
	#在没有新数据包到达的情况下，活跃蓝图上传进程被丢弃前的游戏刻数。
	#范围：> 100
	schematicIdleTimeout = 600

	#.
	#蓝图炮
	[schematics.schematicannon]
		#.
		#大炮两次射击之间的游戏刻数。数值越大 => 越慢
		#范围：> 1
		schematicannonDelay = 10
		#.
		#每提供一个火药，蓝图炮可打印的方块数量。
		#范围：> 1
		schematicannonShotsPerGunpowder = 400

#.
#Create 添加的设备与工具
[equipment]
	#.
	#.
	#对称魔杖触发时到活动镜面的最大距离。
	#范围：> 10
	maxSymmetryWandRange = 50
	#.
	#Create 放置辅助放置的方块与其交互点的最大距离。
	#范围：> 3
	placementAssistRange = 12
	#.
	#工具箱可与玩家背包交互的最大距离。
	#范围：> 1
	toolboxRange = 10
	#.
	#背罐可储存的最大空气量 = 水下呼吸秒数
	#范围：> 1
	airInBacktank = 900
	#.
	#背罐容量附魔每级增加的空气量
	#范围：> 1
	enchantedBacktankCapacity = 300
	#.
	#一个充满的铜背罐提供的免费伸缩握把使用次数。设为 0 则伸缩握把不会损坏
	#范围：> 0
	maxExtendoGripActions = 1000
	#.
	#一个充满的铜背罐提供的免费土豆炮射击次数。设为 0 则土豆炮不会损坏
	#范围：> 0
	maxPotatoCannonShots = 200

#.
#Create 内置的铁路系统
[trains]
	#.
	#.
	#移动的列车是否会伤害碰撞到的生物与玩家。
	trainsCauseDamage = true
	#.
	#可作为一批或一次转弯放置的轨道最大长度。
	#范围：16 ~ 128
	maxTrackPlacementLength = 32
	#.
	#列车车站组装轨道的最大长度。
	#范围：> 5
	maxAssemblyLength = 128
	#.
	#组装为单列车的最大转向架数量。
	#范围：> 1
	maxBogeyCount = 20
	#.
	#手动控制列车相对于计划列车的速度比例。
	#范围：0.0 ~ 3.4028234663852886E38
	manualTrainSpeedModifier = 0.75

	#.
	#标准列车
	[trains.trainStats]
		#.
		#[单位：方块/秒]
		#任何组装列车的最高速度。
		#范围：0.0 ~ 3.4028234663852886E38
		trainTopSpeed = 28.0
		#.
		#[单位：方块/秒]
		#列车转弯时的最高速度。
		#范围：0.0 ~ 3.4028234663852886E38
		trainTurningTopSpeed = 14.0
		#.
		#[单位：方块/秒²]
		#任何组装列车的加速度。
		#范围：0.0 ~ 3.4028234663852886E38
		trainAcceleration = 3.0

	#.
	#动力列车
	[trains.poweredTrainStats]
		#.
		#[单位：方块/秒]
		#动力列车的最高速度。
		#范围：0.0 ~ 3.4028234663852886E38
		poweredTrainTopSpeed = 40.0
		#.
		#[单位：方块/秒]
		#动力列车转弯时的最高速度。
		#范围：0.0 ~ 3.4028234663852886E38
		poweredTrainTurningTopSpeed = 20.0
		#.
		#[单位：方块/秒²]
		#动力列车的加速度。
		#范围：0.0 ~ 3.4028234663852886E38
		poweredTrainAcceleration = 3.0

