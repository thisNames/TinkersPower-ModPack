# 机械动力：汽鸣铁道
#杂项设置
[misc]
	#.
	#耦合器将要求两点位于相同或相邻的轨道边缘，若两点之间存在任何形式的道岔，耦合器将无法工作。
	strictCoupler = false
	#.
	#允许在列车上接近黄铜开关时远程控制它们
	flipDistantSwitches = true
	#.
	#目标轨道与已放置的开关立杆之间的最大距离
	#范围：16 ~ 128
	switchPlacementRange = 64
	#.
	#允许苦力怕与恶魂火球破坏轨道
	creeperTrackDamage = false
	#.
	#使用手摇车时，用于计算速度带来饥饿消耗的倍数。
	#范围：0.0 ~ 1.0
	handcarHungerMultiplier = 0.009999999776482582
	#.
	#压路机碾过时会清除被雪包裹的轨道。
	rollersClearSnow = true
	#.
	#允许创造模式玩家无距离限制地迁移列车。
	#[@cui:RequiresRelog]
	unlimitedCreativeRelocation = false

#.
#信号灯设置
[semaphores]
	#.
	#.
	#简化信号灯放置（不可倒置放置）
	simplifiedPlacement = true
	#.
	#当信号灯倒置时，其颜色顺序是否反转
	flipYellowOrder = false

#.
#列车长设置
[conductors]
	#.
	#.
	#列车长哨声仅限列车所有者使用
	mustOwnBoundTrain = false
	#.
	#列车长通风管的最大长度
	#范围：> 1
	maxConductorVentLength = 64
	#.
	#列车长哨声更新所绑定列车的频率
	#范围：1 ~ 600
	whistleRebindRate = 10

#.
#真实感设置
[realism]
	#.
	#.
	#使列车需要燃料才能运行（来自燃料罐或箱子/桶中的固体燃料）
	realisticTrains = false
	#.
	#使燃料罐只接受合适的液体燃料（因此水等无法注入）
	realisticFuelTanks = true

