# 经验之书
#XP 之书可容纳的最大 XP 点数。默认值（1395）相当于拥有 30 级。
#范围：> 1
max_xp = 1395
#书本返还的 XP 百分比，作为使用它的一种代价。
#示例：若此配置值设为 0.75，而某本 XP 之书储存了 100 XP，尝试取回这 100 XP 时将返还 75 XP。
#注意：这并非 100% 精确，因为 Minecraft 的 XP 不使用小数。
#范围：0.0 ~ 1.0
retrieval_percentage = 1.0
#设为 true 时，每次只从书中扣除玩家升到下一级所需的 XP 量。
retrieve_until_next_level = false
#设为 true 时，将以 XP 球的形式从书中扣除 XP。若你想把书中的 XP 用于具有经验修补附魔的工具，这会很有用。
retrieve_xp_orbs = false
#设为 true 时，只会从玩家经验条储存 XP 直到回到上一级，即每次最多只向书的储存中添加一级。
store_until_previous_level = false

