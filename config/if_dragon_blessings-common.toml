
#电龙攻击（闪电链）相关配置
[chainLightning]
	#闪电链搜索半径上限（格）：等级 0 即为起始半径，每升一级 +2 格，不超过此值。
	#Range: 1 ~ 48
	searchRange = 14
	#闪电链搜索半径起始值（等级 0 时的半径），每升一级 +2 格，封顶 searchRange。
	#Range: 1 ~ 48
	searchRangeBase = 8
	#最多受到闪电链伤害的实体数量上限（不包含被击中的中心目标）：等级 0 即为起始数量，每升一级 +1，不超过此值。
	#Range: 1 ~ 32
	maxTargets = 9
	#闪电链目标数量起始值（等级 0），每升一级 +1，封顶 maxTargets。
	#Range: 1 ~ 32
	maxTargetsBase = 6
	#电龙之力（lightning_attack）buff 的最大有效等级，超过部分按此上限计算。
	#Range: 1 ~ 10
	lightningAttackMaxLevel = 3
	#中心目标（被击中的实体）受到的闪电伤害。
	#Range: 0.0 ~ 100.0
	centerDamage = 5.0
	#第一个被链目标受到的基础闪电伤害，后续目标按 chainDamageDecay 逐级递减。
	#Range: 0.0 ~ 100.0
	chainDamageBase = 4.0
	#每个后续被链目标的伤害递减比例（0~1）。例如 0.125 表示每级递减 12.5%，基础伤害越大递减越明显。
	#Range: 0.0 ~ 1.0
	chainDamageDecay = 0.125
	#闪电链外层光晕颜色（十六进制 0xRRGGBB）。默认亮紫 0xB44DFF。
	#Range: 0 ~ 16777215
	outerColor = 11816447
	#闪电链内芯颜色（十进制整数）。例如白色 0xFFFFFF = 16777215。
	#Range: 0 ~ 16777215
	innerColor = 16777215
	#闪电链外层光晕的不透明度系数（0~1）。1.0 为完全不透明。
	#Range: 0.0 ~ 1.0
	outerOpacity = 0.9
	#闪电链内芯的不透明度系数（0~1）。1.0 为完全不透明。
	#Range: 0.0 ~ 1.0
	innerOpacity = 1.0
	#闪电链触发的冷却时间（tick）。防止手速过快时闪电链频繁叠加。
	#Range: 0 ~ 200
	cooldown = 10
	#闪电链粒子效果的同步半径（格）：只向该范围内玩家发送粒子包。建议不小于闪电链搜索半径，否则远处玩家看不到粒子。
	#Range: 8.0 ~ 256.0
	syncDistance = 64.0
	#电龙攻击的伤害方式：true = 原版雷击电；false = 魔法电（魔法伤害，不点燃不转换，默认）。
	useVanillaLightning = false
	#魔法电模式下是否把苦力怕转换成闪电苦力怕（只有苦力怕受伤的世界达成！）。true = 转换（默认）；false = 不转换。
	magicCreeperConversion = true

#元素反应相关配置
[elementalReactions]
	#元素反应总开关：冰+火=融化、冰+电=超导、火+电=超载。true = 开启（默认）；false = 关闭。
	enabled = true

#火龙 / 冰龙攻击相关配置
[dragonAttacks]
	#火龙之力（fire_attack）buff 的最大有效等级，超过部分按此上限计算。每级 +25% 燃烧/烈焰标记时长与击退强度。
	#Range: 1 ~ 10
	fireAttackMaxLevel = 3
	#冰龙之力（ice_attack）buff 的最大有效等级，超过部分按此上限计算。每级 +25% 冰封/缓慢/挖掘疲劳时长。
	#Range: 1 ~ 10
	iceAttackMaxLevel = 3

